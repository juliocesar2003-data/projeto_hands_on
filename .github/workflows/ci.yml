name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  testes:
    name: Lint e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check --output-format github .

      - name: Testes (pytest)
        run: pytest -v

  validar_bundle:
    name: Validar bundle Databricks
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Verificar secrets
        id: secrets
        run: |
          if [ -z "$DATABRICKS_HOST" ] || [ -z "$DATABRICKS_TOKEN" ]; then
            echo "::warning::Secrets DATABRICKS_HOST/DATABRICKS_TOKEN não configurados; validação do bundle ignorada."
            echo "configurados=false" >> "$GITHUB_OUTPUT"
          else
            echo "configurados=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: databricks/setup-cli@main
        if: steps.secrets.outputs.configurados == 'true'

      - name: databricks bundle validate
        if: steps.secrets.outputs.configurados == 'true'
        run: databricks bundle validate -t prod
