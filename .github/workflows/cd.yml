name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at the same time
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    name: Deploy no Databricks
    needs: ci
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Verificar secrets
        run: |
          if [ -z "$DATABRICKS_HOST" ] || [ -z "$DATABRICKS_TOKEN" ]; then
            echo "::error::Configure os secrets DATABRICKS_HOST e DATABRICKS_TOKEN no repositório (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: databricks/setup-cli@main

      - name: databricks bundle deploy
        run: databricks bundle deploy -t prod
